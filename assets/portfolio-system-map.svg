<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.48" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="150" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="160" cy="465" r="210" fill="#FFFFFF" opacity="0.05"/>

  <text x="64" y="82" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="18" font-weight="700" letter-spacing="3">AI / ML / DATA SYSTEMS</text>
  <text x="64" y="132" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="46" font-weight="800">Sathwik Rao Nadipelli</text>
  <text x="64" y="170" fill="#DFF7FF" font-family="Inter, ui-sans-serif, system-ui" font-size="22">Runnable systems with APIs, evaluation, monitoring, and deployment paths</text>

  <g filter="url(#shadow)">
    <rect x="64" y="226" width="310" height="178" rx="24" fill="url(#card)" stroke="#93C5FD" stroke-opacity="0.35"/>
    <text x="92" y="270" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">Retrieval Systems</text>
    <text x="92" y="305" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">RAG, hybrid retrieval,</text>
    <text x="92" y="330" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">reranking, citations,</text>
    <text x="92" y="355" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">document intelligence</text>
    <text x="92" y="384" fill="#A7F3D0" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">rag-ops-platform</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="226" width="310" height="178" rx="24" fill="url(#card)" stroke="#93C5FD" stroke-opacity="0.35"/>
    <text x="473" y="270" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">ML Platforms</text>
    <text x="473" y="305" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">training-to-serving parity,</text>
    <text x="473" y="330" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">model registry patterns,</text>
    <text x="473" y="355" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">ranking and monitoring</text>
    <text x="473" y="384" fill="#A7F3D0" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">ml-training-serving-platform</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="826" y="226" width="310" height="178" rx="24" fill="url(#card)" stroke="#93C5FD" stroke-opacity="0.35"/>
    <text x="854" y="270" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">Data Infrastructure</text>
    <text x="854" y="305" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">Kafka/Redpanda, DuckDB,</text>
    <text x="854" y="330" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">feature pipelines, CDC,</text>
    <text x="854" y="355" fill="#DBEAFE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">lakehouse reliability</text>
    <text x="854" y="384" fill="#A7F3D0" font-family="Inter, ui-sans-serif, system-ui" font-size="16" font-weight="700">streaming-feature-platform</text>
  </g>

  <path d="M374 314H445" stroke="#BFDBFE" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <path d="M755 314H826" stroke="#BFDBFE" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <circle cx="410" cy="314" r="7" fill="#A7F3D0"/>
  <circle cx="790" cy="314" r="7" fill="#A7F3D0"/>

  <rect x="64" y="438" width="1072" height="42" rx="21" fill="#020617" opacity="0.35"/>
  <text x="95" y="465" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">FastAPI</text>
  <text x="190" y="465" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">Docker</text>
  <text x="290" y="465" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">GCP / AWS</text>
  <text x="420" y="465" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">Kafka</text>
  <text x="510" y="465" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">PyTorch</text>
  <text x="620" y="465" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">scikit-learn</text>
  <text x="770" y="465" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">Prometheus</text>
  <text x="925" y="465" fill="#E0F2FE" font-family="Inter, ui-sans-serif, system-ui" font-size="17">MLflow patterns</text>
